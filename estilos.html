<style>
/* ── RESET Y BASE ──────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5;
       color: #2d3748; display: flex; height: 100vh; overflow: hidden; }

/* ── SIDEBAR ────────────────────────────────────────────────── */
#sidebar { width: 220px; min-width: 220px; background: #1a202c; color: #e2e8f0;
           display: flex; flex-direction: column; padding: 0; box-shadow: 2px 0 8px rgba(0,0,0,.3); }
.sidebar-header { padding: 20px 16px; background: #2d3748; font-weight: 700;
                  font-size: 15px; display: flex; align-items: center; gap: 10px; }
.sidebar-header .icon { font-size: 22px; }
.nav-list { list-style: none; flex: 1; padding: 12px 0; overflow-y: auto; }
.nav-item  { padding: 11px 20px; cursor: pointer; font-size: 13px; transition: background .15s;
             border-left: 3px solid transparent; }
.nav-item:hover  { background: #2d3748; border-left-color: #63b3ed; }
.nav-item.active { background: #2c5282; border-left-color: #63b3ed; font-weight: 600; }
.sync-box { padding: 14px; border-top: 1px solid #2d3748; }
.btn-sync  { width: 100%; padding: 9px; background: #2b6cb0; border: none; border-radius: 6px;
             color: white; font-size: 13px; cursor: pointer; font-weight: 600; transition: background .2s; }
.btn-sync:hover { background: #2c5282; }
.sync-status { font-size: 11px; color: #a0aec0; margin-top: 6px; text-align: center; }

/* ── CONTENIDO PRINCIPAL ────────────────────────────────────── */
#main-content { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }

/* ── VISTAS ─────────────────────────────────────────────────── */
.view { display: none; }
.view.active { display: block; }
.view-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
               margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #e2e8f0; }
.view-header h2 { font-size: 20px; color: #2c5282; font-weight: 700; }
.subtitle { font-size: 13px; color: #718096; }

/* ── BARRA DE ESTADÍSTICAS ──────────────────────────────────── */
.stats-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.stat-card { background: white; border-radius: 8px; padding: 12px 18px; font-size: 13px;
             box-shadow: 0 1px 3px rgba(0,0,0,.1); min-width: 130px; }
.stat-card .num { font-size: 22px; font-weight: 700; color: #2b6cb0; }
.stat-card .lbl { color: #718096; font-size: 11px; }

/* ── GRILLA DEL CALENDARIO ──────────────────────────────────── */
.calendar-grid { display: flex; flex-direction: column; gap: 8px; }
.day-card { background: white; border-radius: 10px; overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.day-header { display: flex; align-items: center; gap: 10px; padding: 8px 14px;
              background: #edf2f7; border-bottom: 1px solid #e2e8f0; }
.day-name  { font-weight: 700; font-size: 13px; color: #2d3748; text-transform: uppercase; }
.day-num   { background: #2b6cb0; color: white; border-radius: 50%; width: 28px; height: 28px;
             display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
.day-num.hoy { background: #e53e3e; }
.events-list { display: flex; flex-direction: column; }
.event-row   { display: grid; grid-template-columns: 80px 1fr; gap: 0; border-bottom: 1px solid #f7fafc;
               cursor: pointer; transition: background .1s; }
.event-row:hover { background: #f7fafc; }
.event-row:last-child { border-bottom: none; }
.event-time  { padding: 8px 10px; font-size: 11px; font-weight: 600; color: #718096;
               border-right: 1px solid #e2e8f0; background: #f7fafc; }
.event-info  { padding: 8px 12px; }
.event-tipo  { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #4a5568; }
.event-title { font-size: 13px; font-weight: 600; color: #2d3748; margin-top: 2px; }
.event-space { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 3px;
               background: #e2e8f0; color: #4a5568; margin-top: 4px; }
.event-pending { background: #fff5f5 !important; border-left: 3px solid #fc8181; }

/* ── TABLA GENÉRICA ─────────────────────────────────────────── */
.tabla-gen { width: 100%; border-collapse: collapse; font-size: 13px; background: white;
             border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.tabla-gen th { background: #2c5282; color: white; padding: 10px 12px; text-align: left;
                font-size: 12px; font-weight: 600; }
.tabla-gen td { padding: 9px 12px; border-bottom: 1px solid #f0f2f5; vertical-align: top; }
.tabla-gen tr:hover td { background: #ebf8ff; }
.tabla-gen tr:last-child td { border-bottom: none; }

/* ── BÚSQUEDA ───────────────────────────────────────────────── */
.search-box { display: flex; gap: 10px; margin-bottom: 20px; }
.search-box input { flex: 1; padding: 10px 14px; border: 1px solid #e2e8f0;
                    border-radius: 6px; font-size: 14px; }
.search-box input:focus { outline: none; border-color: #63b3ed; box-shadow: 0 0 0 2px rgba(99,179,237,.3); }

/* ── BOTONES ────────────────────────────────────────────────── */
button { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer;
         font-size: 13px; font-weight: 600; transition: all .15s; }
button:hover { opacity: .88; transform: translateY(-1px); }
.btn-primary { background: #2b6cb0; color: white; }
.btn-danger  { background: #e53e3e; color: white; }
.btn-green   { background: #38a169; color: white; }
.filtros     { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filtros input, .filtros select { padding: 7px 10px; border: 1px solid #e2e8f0;
                                   border-radius: 6px; font-size: 13px; }
select { background: white; }

/* ── LEYENDA ────────────────────────────────────────────────── */
.leyenda-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
                gap: 10px; }
.leyenda-item { display: flex; align-items: center; gap: 12px; padding: 12px;
                border-radius: 8px; background: white; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.leyenda-color { width: 36px; height: 36px; border-radius: 6px; flex-shrink: 0;
                 border: 1px solid rgba(0,0,0,.1); }
.leyenda-label { font-size: 13px; font-weight: 600; color: #2d3748; }
.leyenda-hex   { font-size: 11px; color: #a0aec0; }

/* ── CONFIGURACIÓN ──────────────────────────────────────────── */
#panel-config { background: white; border-radius: 10px; padding: 20px;
                box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; }
.config-row   { display: grid; grid-template-columns: 200px 1fr auto; gap: 10px;
                align-items: center; margin-bottom: 12px; padding-bottom: 12px;
                border-bottom: 1px solid #f0f2f5; }
.config-row:last-child { border-bottom: none; margin-bottom: 0; }
.config-key   { font-weight: 600; font-size: 13px; color: #4a5568; }
.config-input { padding: 7px 10px; border: 1px solid #e2e8f0; border-radius: 6px;
                font-size: 13px; width: 100%; }
.config-actions { background: white; border-radius: 10px; padding: 20px;
                  box-shadow: 0 1px 4px rgba(0,0,0,.08); display: flex; flex-wrap: wrap; gap: 10px; }
.config-actions h3 { width: 100%; font-size: 15px; color: #2c5282; margin-bottom: 6px; }

/* ── MODAL ──────────────────────────────────────────────────── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
                 z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal-box     { background: white; border-radius: 12px; padding: 28px; max-width: 560px;
                 width: 95%; max-height: 90vh; overflow-y: auto; position: relative;
                 box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal-close   { position: absolute; top: 12px; right: 14px; background: #e2e8f0;
                 border-radius: 50%; width: 28px; height: 28px; display: flex;
                 align-items: center; justify-content: center; font-size: 14px; }
.modal-tipo    { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #718096;
                 margin-bottom: 6px; }
.modal-titulo  { font-size: 18px; font-weight: 700; color: #2d3748; margin-bottom: 16px; }
.modal-field   { margin-bottom: 10px; }
.modal-field .lbl { font-size: 11px; font-weight: 700; color: #a0aec0; text-transform: uppercase; }
.modal-field .val { font-size: 13px; color: #2d3748; margin-top: 2px; }
.req-box { background: #f7fafc; border-radius: 6px; padding: 10px; font-size: 12px; color: #4a5568; }

/* ── TOAST ──────────────────────────────────────────────────── */
.toast { position: fixed; bottom: 24px; right: 24px; background: #2d3748; color: white;
         padding: 12px 20px; border-radius: 8px; font-size: 13px; display: none;
         z-index: 2000; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
.toast.show { display: block; animation: slideIn .3s ease; }
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; }
                     to   { transform: translateY(0);   opacity: 1; } }

/* ── LOADING ────────────────────────────────────────────────── */
.loading { text-align: center; padding: 40px; color: #a0aec0; font-size: 16px; }
.loading::after { content: ''; animation: dots 1.2s infinite; }
@keyframes dots { 0%,20%{content:'.'} 40%{content:'..'} 60%,100%{content:'...'} }

/* ── BADGE ──────────────────────────────────────────────────── */
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px;
         font-weight: 700; }
.badge-new  { background: #c6f6d5; color: #276749; }
.badge-mod  { background: #fefcbf; color: #7b6000; }
.badge-del  { background: #fed7d7; color: #9b2c2c; }
.badge-pend { background: #feebc8; color: #7b341e; }

@media (max-width: 700px) {
  #sidebar { width: 60px; }
  .brand, .nav-item span:not(.icon) { display: none; }
  #main-content { padding: 12px; }
}
</style>
